<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f4f4f4);
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #222;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        input, select {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        button {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            transform: scale(0.97);
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        .filter-row label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .filter-row select {
            flex: 1;
        }

        /* ===== NAYA: Category summary cards ===== */
        .summary-box {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .summary-card {
            flex: 1;
            min-width: 90px;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border-top: 3px solid #4CAF50;
        }

        .summary-card .cat-name {
            font-size: 12px;
            color: #777;
        }

        .summary-card .cat-amount {
            font-size: 16px;
            font-weight: bold;
            color: #222;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .expense-info .name {
            font-weight: bold;
            color: #222;
        }

        .expense-info .details {
            font-size: 12px;
            color: #888;
        }

        li button {
            background: #e74c3c;
            padding: 6px 12px;
        }

        li button:hover {
            background: #c0392b;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }

        .total-box {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 10px;
            text-align: center;
        }

        .total-box .label {
            color: #eaffea;
            font-size: 13px;
        }

        .total-box .amount {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Expense Tracker</h1>
        <p>My first working project 🚀</p>

        <h2>Add Expense</h2>

        <div class="input-row">
            <input type="text" id="expenseName" placeholder="Expense name">
            <input type="number" id="expenseAmount" placeholder="Amount">
        </div>

        <div class="input-row">
            <select id="expenseCategory">
                <option value="Food">🍔 Food</option>
                <option value="Travel">🚗 Travel</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">🧾 Bills</option>
                <option value="Other">📦 Other</option>
            </select>
            <input type="date" id="expenseDate">
        </div>

        <button onclick="addExpense()">Add Expense</button>

        <div class="filter-row">
            <label>Filter:</label>
            <select id="filterCategory" onchange="saveAndRender()">
                <option value="All">Show All</option>
                <option value="Food">🍔 Food</option>
                <option value="Travel">🚗 Travel</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">🧾 Bills</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <!-- ===== NAYA: Category-wise summary yahan dikhega ===== -->
        <div class="summary-box" id="summaryBox"></div>

        <ul id="expenseList"></ul>

        <div class="total-box">
            <div class="label">TOTAL SPENT</div>
            <div class="amount">₹<span id="totalAmount">0</span></div>
        </div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
        let total = 0;

        document.getElementById("expenseDate").valueAsDate = new Date();

        function addExpense() {
            const nameInput = document.getElementById("expenseName");
            const amountInput = document.getElementById("expenseAmount");
            const categoryInput = document.getElementById("expenseCategory");
            const dateInput = document.getElementById("expenseDate");

            const name = nameInput.value;
            const amount = Number(amountInput.value);
            const category = categoryInput.value;
            const date = dateInput.value;

            if (name === "" || amount <= 0 || isNaN(amount)) {
                alert("Please enter valid expense name and amount!");
                return;
            }

            const expense = { name, amount, category, date };
            expenses.push(expense);

            saveAndRender();

            nameInput.value = "";
            amountInput.value = "";
        }

        function removeExpense(index) {
            expenses.splice(index, 1);
            saveAndRender();
        }

        // ===== NAYA FUNCTION: Category ke hisaab se total nikalta hai =====
        function renderSummary() {
            // Ek khaali "dabba" (object) banaya jisme har category ka total store hoga
            // Jaise: { Food: 500, Travel: 200 }
            const categoryTotals = {};

            expenses.forEach(exp => {
                // Agar is category ka entry pehle se nahi hai, toh 0 se shuru karo
                if (!categoryTotals[exp.category]) {
                    categoryTotals[exp.category] = 0;
                }
                // Us category mein amount add karo
                categoryTotals[exp.category] += exp.amount;
            });

            const summaryBox = document.getElementById("summaryBox");
            summaryBox.innerHTML = "";

            // Object ki har "key" (category naam) pe loop chalao
            for (const category in categoryTotals) {
                const card = document.createElement("div");
                card.className = "summary-card";
                card.innerHTML = `
                    <div class="cat-name">${category}</div>
                    <div class="cat-amount">₹${categoryTotals[category]}</div>
                `;
                summaryBox.appendChild(card);
            }
        }

        function saveAndRender() {
            localStorage.setItem("expenses", JSON.stringify(expenses));

            const selectedFilter = document.getElementById("filterCategory").value;

            let filteredExpenses = expenses;
            if (selectedFilter !== "All") {
                filteredExpenses = expenses.filter(exp => exp.category === selectedFilter);
            }

            const listElement = document.getElementById("expenseList");
            listElement.innerHTML = "";

            total = 0;
            expenses.forEach(exp => total += exp.amount);

            if (filteredExpenses.length === 0) {
                listElement.innerHTML = `<div class="empty-msg">Is category mein koi expense nahi hai</div>`;
            } else {
                filteredExpenses.forEach((exp) => {
                    const realIndex = expenses.indexOf(exp);

                    const li = document.createElement("li");
                    li.innerHTML = `
                        <div class="expense-info">
                            <div class="name">${exp.name} - ₹${exp.amount}</div>
                            <div class="details">${exp.category} • ${exp.date}</div>
                        </div>
                        <button onclick="removeExpense(${realIndex})">Delete</button>
                    `;
                    listElement.appendChild(li);
                });
            }

            document.getElementById("totalAmount").innerText = total;

            renderSummary(); // NAYA: summary bhi update karo
        }

        saveAndRender();
    </script>

</body>
</html>
